name: Randomizer CI

# Phase A0 CI scaffolding (tasks.md §1.0a-h, §1.6b).
# Each guard is documented as either "runnable in A0" or "scaffold; activates
# when X lands". Scaffolds intentionally exit zero today; they become live the
# moment their dependency arrives.

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Source-level guards (no compile needed). Cheap; run on every push/PR.
  # --------------------------------------------------------------------------
  rando-source-guards:
    name: Rando source guards (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        # Need history for the kGeneratorVersion bump-gate diff
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install Python deps
      run: pip install pyyaml

    # Repo hygiene — generated/extracted data belongs in gitignored artifacts,
    # not inlined into source as hex.
    - name: check_no_embedded_data
      run: python assets/scripts/check_no_embedded_data.py

    # Task 1.0b — Determinism-grep on src/rando/*.[ch]
    - name: check_determinism (1.0b)
      run: python assets/scripts/check_determinism.py

    # Door-shuffle tables — committed reference-derived artifacts; counts must
    # stay consistent with the frozen registry (door ids are save-affecting).
    - name: check_door_tables
      run: python assets/scripts/check_door_tables.py

    # Pot-sanity table freshness is local-only: pots.gen.yaml and
    # pot_key_depth.gen.yaml are gitignored ROM-derived artifacts. Run
    # assets/scripts/run_rando_local_checks.py with local assets before merging
    # pot-table work.

    # Task 1.0c — Byte-order pin grep on src/rando/*.[ch]
    - name: check_byte_order (1.0c)
      run: python assets/scripts/check_byte_order.py

    # Task 1.0g / §6.10 — Audit guard. Now in --strict mode: every grant-site
    # write to inventory state MUST be either dispatched via Rando_OnLocationCheck
    # or carry an explicit `// rando-exempt: <reason>` comment.
    - name: check_audit_guard (1.0g + 6.10, strict)
      run: python assets/scripts/check_audit_guard.py --strict

    # Task 1.6b — Codegen-wiring parity across Makefile / MSVC / Switch
    - name: check_codegen_wiring (1.6b)
      run: python assets/scripts/check_codegen_wiring.py

    # Task 1.0e — kGeneratorVersion PR-gate (needs base/head shas; only meaningful on PRs)
    - name: check_generator_version (1.0e)
      if: github.event_name == 'pull_request'
      run: |
        python assets/scripts/check_generator_version.py \
          --base-sha "${{ github.event.pull_request.base.sha }}" \
          --head-sha "${{ github.event.pull_request.head.sha }}"

    - name: check_generator_version (1.0e, push event — diff vs before)
      if: github.event_name != 'pull_request'
      # On a direct push (e.g. a merge that lands via push) diff the push range
      # so a bump-trigger edit without a version bump fails HERE too, not only on
      # the PR event (audit L20). github.event.before is 000…0 on the first push
      # / a force-push; the script's git diff then errors and the check degrades
      # to presence-only (returns 0), so this can never false-fail.
      run: |
        python assets/scripts/check_generator_version.py \
          --base-sha "${{ github.event.before }}" \
          --head-sha "${{ github.sha }}"

    # Task 1.0a — Regression-corpus manifest schema check. This job does NOT
    # build, so run schema-only; the full corpus (with --binary) runs in the
    # rando-determinism job below.
    - name: run_rando_corpus (1.0a, manifest schema)
      run: python assets/scripts/run_rando_corpus.py --schema-only

    # Corpus-version sync — the manifest's generator_version must equal
    # kGeneratorVersion in src/rando/rando.h. Catches a version bump that
    # forgot to re-stamp the corpus manifest (incl. digest-neutral bumps).
    - name: check_corpus_version_sync
      run: python assets/scripts/check_corpus_version_sync.py

    # Placer determinism (static prong) — the --generate-seed default budget must
    # be 0. A positive default puts a wall-clock cutoff on Place_AssumedFill's
    # retry loop (clock() is wall-clock on Windows), making placement
    # machine-speed-dependent. The runtime prong runs in the rando-determinism
    # job below (needs the binary).
    - name: check_placer_determinism (static)
      run: python assets/scripts/check_placer_determinism.py --source-only

    # Logic-graph silent-override guard — a later base-level logic YAML must not
    # silently change a location/macro/region declared in an earlier one
    # (the King-Zora / Eastern-Palace weaker-predicate regression class).
    - name: check_logic_overrides
      run: python assets/scripts/check_logic_overrides.py

    # Codegen well-formedness in --strict mode. The build invokes
    # rando_logic_gen.py in non-strict mode (warnings logged but
    # build proceeds). CI runs it strictly so any new well-formedness
    # warning (e.g., the region-binding silent-bypass guard added
    # post-King-Zora-regression) fails CI instead of being a build
    # log warning that a maintainer might miss.
    - name: rando_logic_gen --strict
      run: python assets/rando_logic_gen.py --strict

  # --------------------------------------------------------------------------
  # Build-dependent guards. Need a compiled binary / object files. Run on the
  # full OS matrix once src/rando/ has compilable content.
  # --------------------------------------------------------------------------
  rando-build-guards:
    name: Rando build guards (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          os: ubuntu-latest
        - name: Mac
          os: macos-latest
        - name: Windows
          os: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install Python deps
      run: pip install pyyaml pillow

    # Linux build deps
    - name: Install SDL2 (Linux)
      if: matrix.name == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev
    # macOS build deps
    - name: Install SDL2 (Mac)
      if: matrix.name == 'Mac'
      run: brew install sdl2 coreutils
    # Windows build deps: SDL2 is vendored under third_party/SDL2-* per README;
    # the build path is via Zelda3.sln (MSBuild). For A0 we don't build on
    # Windows yet — the rando-build-guards on Windows are scaffold-only and
    # depend on a future MSBuild wiring task.

    # Task 1.0d — Init-order replay (scaffold; activates with task 1.1)
    - name: check_init_order (1.0d)
      shell: bash
      run: python assets/scripts/check_init_order.py

    # Task 1.0f (check_link_symbols) does NOT run here: it scans compiled
    # src/rando/*.o objects, and this job never builds — invoking it pre-build
    # was a guaranteed no-op "clean pass". It runs post-build in the
    # rando-determinism job below (with --require-objects so it can never
    # silently scan nothing again).

    # Task 1.0h — Benchmark gates (scaffold; activates with task 3.8)
    - name: run_rando_benchmarks (1.0h)
      shell: bash
      run: python assets/scripts/run_rando_benchmarks.py

  # --------------------------------------------------------------------------
  # Cross-platform determinism property tests (tasks.md §2.2). Builds the
  # binary on Linux/macOS, runs `--rando-selftest` which validates SHA-256
  # NIST vectors + xoshiro256** 10k-sample digest. Any byte-mismatch fails CI.
  # Windows would need MSBuild wiring (out of scope for A0).
  # --------------------------------------------------------------------------
  rando-determinism:
    name: Rando determinism self-tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          os: ubuntu-latest
        - name: Mac
          os: macos-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install Python deps
      run: pip install pyyaml pillow

    - name: Install SDL2 (Linux)
      if: matrix.name == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev

    - name: Install SDL2 (Mac)
      if: matrix.name == 'Mac'
      run: brew install sdl2 coreutils

    # The binary needs zelda3_assets.dat to start. Asset extraction needs the
    # original ROM, which CI doesn't have. For the self-tests we bypass asset
    # loading by passing --rando-selftest BEFORE LoadAssets runs — see main.c
    # ordering: argv parse -> self-test exit, all before SwitchDirectory /
    # ParseConfigFile / LoadAssets. So we can build the binary and run the
    # self-test without any asset blob present.
    - name: Build (just the binary)
      run: make -j2 zelda3

    # Task 1.0f — Link-time symbol blocklist. An ARTIFACT check: scans the
    # just-built src/rando/*.o via `nm -u` for forbidden non-deterministic
    # symbols (rand/time/...), so it must run AFTER the build.
    # --require-objects: zero objects here means the guard is broken, not
    # clean — fail instead of the local-ergonomics pass.
    - name: check_link_symbols (1.0f, post-build)
      run: python assets/scripts/check_link_symbols.py --require-objects

    - name: Run --rando-selftest
      env:
        DISPLAY: ''  # confirm headless: no display server required
      run: ./zelda3 --rando-selftest

    # Door-shuffle generation net (add-rando-door-shuffle): stitches + proves
    # every shuffleable dungeon across N seeds (connectivity / prover /
    # determinism / oracle==stitcher cross-checks). Like --rando-selftest it
    # runs from committed tables BEFORE LoadAssets (see main.c argv handling),
    # so no zelda3_assets.dat is needed.
    - name: Run --door-selftest
      env:
        DISPLAY: ''
      run: ./zelda3 --door-selftest

    # Task 1.2 / 11.2 init-order replay guard (D7). Replays each
    # saves/ref/Chapter*.sav via the binary's --vanilla-ram-check CLI mode
    # in vanilla mode (no rando slot active) and asserts every newly-added
    # kRam_* offset retained its init-zero value. Proves that no existing
    # vanilla game code writes to the addresses claimed for randomizer state.
    - name: Run init-order replay guard (1.2 / 11.2)
      run: python assets/scripts/check_init_order.py --binary=./zelda3 --strict

    # Cross-platform digest determinism: the corpus manifest digests were
    # captured against a Windows build. The Linux/macOS digests MUST match
    # byte-for-byte per `randomizer-core / Deterministic cross-platform
    # placement`. Any digest diff here surfaces a non-determinism bug.
    - name: Run regression corpus (cross-platform digest check)
      run: python assets/scripts/run_rando_corpus.py --binary=./zelda3 --skip-pot-shuffle

    # Placer determinism (runtime prong) — the corpus only exercises seeds that
    # complete on the first attempt, so it never guards the retry loop where
    # non-determinism hides. This runs a deliberately HARD seed (one that
    # exhausts the retry loop) several times and asserts byte-identical
    # placement + sphere digests, catching any run-to-run non-determinism the
    # all-easy corpus seeds miss.
    - name: Run placer determinism canary (runtime)
      run: python assets/scripts/check_placer_determinism.py --binary=./zelda3

    # Benchmark gate (tasks.md §3.11 / spec: "Default-settings benchmark < 2s").
    # Runs the binary 10 times at default settings; asserts median <= 2000ms.
    - name: Run benchmark (default-settings < 2s)
      run: python assets/scripts/run_rando_benchmarks.py --binary=./zelda3 --samples=10
