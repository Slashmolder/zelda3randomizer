name: Randomizer CI

# Randomizer-specific guards. The source job is ROM-free; the determinism job
# builds real binaries on every desktop runner before invoking binary-dependent
# checks.

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Source-level guards (no compile needed). Cheap; run on every push/PR.
  # --------------------------------------------------------------------------
  rando-source-guards:
    name: Rando source guards (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        # Need history for the kGeneratorVersion bump-gate diff
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install Python deps
      run: pip install pyyaml

    # The workflow delegates the source contract to the same fail-closed runner
    # contributors use. PRs use their exact base/head commits.
    - name: Run authoritative CI source profile (PR)
      if: github.event_name == 'pull_request'
      run: |
        python assets/scripts/run_rando_validation.py ci \
          --phase=source \
          --build-mode=prebuilt \
          --base-sha "${{ github.event.pull_request.base.sha }}" \
          --head-sha "${{ github.event.pull_request.head.sha }}" \
          --timings-json artifacts/rando-validation-source.json

    # Push/workflow-dispatch events normally use the push's before SHA. A zero
    # or absent before value occurs for a newly-created ref; use HEAD's parent,
    # or HEAD itself only for a true root commit where no older version exists.
    - name: Run authoritative CI source profile (push)
      if: github.event_name != 'pull_request'
      run: |
        base="${{ github.event.before }}"
        head="${{ github.sha }}"
        if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
          base="$(git rev-parse "${head}^" 2>/dev/null || printf '%s' "$head")"
        fi
        python assets/scripts/run_rando_validation.py ci \
          --phase=source \
          --build-mode=prebuilt \
          --base-sha "$base" \
          --head-sha "$head" \
          --timings-json artifacts/rando-validation-source.json

  # --------------------------------------------------------------------------
  # Cross-platform determinism property tests (tasks.md §2.2). Builds the
  # binary on Linux/macOS/Windows and runs the binary-dependent rando guard
  # suite. Any digest or self-test mismatch fails CI.
  # --------------------------------------------------------------------------
  rando-determinism:
    name: Rando determinism self-tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          os: ubuntu-latest
          binary: ./zelda3
          object_dir: .
        - name: Mac
          os: macos-latest
          binary: ./zelda3
          object_dir: .
        - name: Windows
          os: windows-latest
          binary: ./bin/x64-Release/zelda3.exe
          object_dir: obj/x64-Release
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install Python deps
      run: pip install pyyaml pillow

    - name: Install SDL2 (Linux)
      if: matrix.name == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev

    - name: Install SDL2 (Mac)
      if: matrix.name == 'Mac'
      run: brew install sdl2 coreutils

    - name: Install SDL2 (Windows)
      if: matrix.name == 'Windows'
      shell: pwsh
      run: |
        $version = "2.32.10"
        $zip = Join-Path $env:RUNNER_TEMP "SDL2-devel-$version-VC.zip"
        Invoke-WebRequest `
          -Uri "https://github.com/libsdl-org/SDL/releases/download/release-$version/SDL2-devel-$version-VC.zip" `
          -OutFile $zip
        Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
        New-Item -ItemType Directory -Force third_party | Out-Null
        Copy-Item -Recurse -Force `
          (Join-Path $env:RUNNER_TEMP "SDL2-$version") `
          (Join-Path "third_party" "SDL2-$version")

    - uses: microsoft/setup-msbuild@v2
      if: matrix.name == 'Windows'

    - name: Add MSVC tools to PATH (Windows)
      if: matrix.name == 'Windows'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $install = & $vswhere -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath
        $toolDir = Get-ChildItem "$install\VC\Tools\MSVC\*\bin\Hostx64\x64" -Directory |
          Sort-Object FullName -Descending |
          Select-Object -First 1
        Add-Content -Path $env:GITHUB_PATH -Value $toolDir.FullName

    # The binary needs zelda3_assets.dat to start. Asset extraction needs the
    # original ROM, which CI doesn't have. For the self-tests we bypass asset
    # loading by passing --rando-selftest BEFORE LoadAssets runs — see main.c
    # ordering: argv parse -> self-test exit, all before SwitchDirectory /
    # ParseConfigFile / LoadAssets. So we can build the binary and run the
    # self-test without any asset blob present.
    - name: Build (Unix)
      if: matrix.name != 'Windows'
      run: make -j2 zelda3

    - name: Build (Windows)
      if: matrix.name == 'Windows'
      run: msbuild Zelda3.sln /m /p:Configuration=Release /p:Platform=x64

    # Run the exact public runtime contract through the same central profile on
    # every platform. Linux alone adds wall-time budgets and depfile behavior;
    # all three retain digest, self-test, slot, invariant, and RAM coverage.
    - name: Run authoritative CI runtime profile
      shell: bash
      env:
        DISPLAY: ''
      run: |
        python assets/scripts/run_rando_validation.py ci \
          --phase=runtime \
          --build-mode=prebuilt \
          --binary="${{ matrix.binary }}" \
          --object-dir="${{ matrix.object_dir }}" \
          --timings-json="artifacts/rando-validation-runtime-${{ matrix.name }}.json" \
          --artifacts-dir="artifacts/runtime-${{ matrix.name }}"

    - name: Upload runtime validation telemetry
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rando-validation-runtime-${{ matrix.name }}
        path: |
          artifacts/rando-validation-runtime-${{ matrix.name }}.json
          artifacts/runtime-${{ matrix.name }}
        if-no-files-found: warn
