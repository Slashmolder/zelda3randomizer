# direct_grant_icons.yaml — per-item confirmation-icon table for the §7.6
# direct-grant visible-confirmation ancilla (OpenSpec change
# add-rando-confirmation-icons, Phase B Slice 9).
#
# WHAT THIS DRIVES
# ----------------
# When Rando_DispatchVanillaGrant returns kRandoLttpSkip (a direct-write item
# that bypasses Link_ReceiveItem — magic upgrades, prize bits, dungeon-item
# bits, Triforce pieces), Rando_ShowDirectGrantConfirmation(item_id) plays the
# receive sound, refreshes the HUD, and — using this table — spawns a custom
# item-receipt ancilla (kAncillaType_RandoIconReceipt) that animates the
# correct item icon rising above Link's head, exactly like a normal pickup.
#
# HOW THE ICON IS RENDERED (read before editing these fields)
# -----------------------------------------------------------
# The vanilla receive-item ancilla (Ancilla22_ItemReceipt / AncillaAdd_ItemReceipt
# in src/misc.c) does NOT reference a fixed tile address in the graphics blob.
# Instead it DMAs the item's animated-sprite tile bundle into a fixed VRAM tile
# slot via DecodeAnimatedSpriteTile_variable(gfx), then draws OAM chars 0x24
# (top) and 0x34 (bottom) out of that slot. The icon's appearance is therefore
# selected by the GFX-bundle index, NOT by an OAM tile number.
#
# So each entry pins three values, all derived from the vanilla receive-item
# tables in src/misc.c / src/sprite_main.c, indexed by the item's natural LttP
# receive code:
#
#   gfx       - DecodeAnimatedSpriteTile_variable() index = kReceiveItemGfx[lttp].
#               This is the verified item→sprite-bundle mapping the vanilla
#               receive animation already uses for that exact item. gfx == 0
#               is the AUDIO-ONLY SENTINEL (no icon spawned) — no direct-grant
#               item legitimately maps to bundle 0 (sword/bow), so 0 is a safe
#               "not mapped" gate.
#   big       - the OAM size byte = kReceiveItem_Tab1[lttp]. Value 0 means an
#               8x16 sprite (a second tile, char 0x34, is drawn below the top
#               char 0x24); value 2 means a single tile.
#   oam_flags - the OAM palette/priority byte = (kWishPond2_OamFlags[lttp] * 2)
#               | 0x30, matching Ancilla_ReceiveItem_Draw exactly. The palette
#               is what distinguishes the three pendants (same gfx 0x23,
#               different palette → green / red / blue).
#
# DISCOVERY METHOD (per tasks.md §1.3 — no guessing)
# --------------------------------------------------
# Every mapped value below was computed by indexing the vanilla tables by the
# direct-grant item's destination RAM cell:
#   - Find the LttP receive code whose kMemoryLocationToGiveItemTo[code] equals
#     the cell the direct-grant writes (link_dungeon_map=0xf368, link_compass=
#     0xf364, link_bigkey=0xf366, link_num_keys=0xf36f, link_which_pendants=
#     0xf374, link_has_crystals=0xf37a). See prize_item_direct_grant /
#     dungeon_item_direct_grant in src/rando/rando.c.
#   - Read gfx = kReceiveItemGfx[code], big = kReceiveItem_Tab1[code],
#     oam_flags = (kWishPond2_OamFlags[code]*2)|0x30.
# These reuse the same bundle the vanilla pickup of that item already shows, so
# the icon is guaranteed to match without any new sprite art.
#
# ITEMS LEFT AUDIO-ONLY (gfx: 0) — none remain. HalfMagic / QuarterMagic /
# TriforcePiece were the last and now have custom art (see CUSTOM-ART GFX IDS
# below). gfx: 0 stays the audio-only sentinel for any future unmapped item.
#   - SmallKey_*: SmallKey direct-grant is a Phase B follow-on (it currently
#     falls through to the vanilla current-dungeon path in
#     dungeon_item_direct_grant, so it does NOT reach the skip branch today).
#     The gfx mapping (kReceiveItemGfx[0x24]=0x0f) IS known and is recorded
#     here so the icon is ready the moment SmallKey direct-grant lands; it is
#     harmless until then because the code never passes a SmallKey id to the
#     confirmation helper.

# CUSTOM-ART GFX IDS (add-rando-field-item-custom-art)
# -----------------------------------------------------
# gfx values with the 0x80 bit set are NOT vanilla bundle indices: they are
# kRandoCustomGfx_* ids (src/rando/rando.h), handled by
# Rando_EnsureRecvItemSlotGfx — the tile comes from the kRandoCustomItemGfx
# asset (committed source: assets/rando/custom_item_gfx.png) or a re-coloured
# vanilla bundle, plus a dedicated 8-colour palette loaded into sprite palette
# 3's upper half. Such entries use oam_flags 0x36 (palette 3, priority 0x30).
# Keep the ids in sync with the rando.h enum.

icons:
  # --- custom art (no vanilla receive bundle; see header note) ---
  TriforcePiece: { gfx: 0x80, big: 2, oam_flags: 0x36, notes: "kRandoCustomGfx_TriforcePiece: 16x16 triforce tile (kRandoCustomItemGfx entry 0, MIT z3r art) + green_blue_guard upper-half palette via SP3" }
  HalfMagic:     { gfx: 0x81, big: 2, oam_flags: 0x36, notes: "kRandoCustomGfx_HalfMagic: 16x16 1/2-magic decanter (kRandoCustomItemGfx entry 1, MIT z3r art) + green_blue_guard upper-half palette via SP3" }
  QuarterMagic:  { gfx: 0x82, big: 2, oam_flags: 0x36, notes: "kRandoCustomGfx_QuarterMagic: 16x16 1/4-magic decanter (kRandoCustomItemGfx entry 2, MIT z3r art) + green_blue_guard upper-half palette via SP3" }

