# direct_grant_icons.yaml — per-item icon table for §7.6 direct-grant
# visible confirmation (Phase B Slice 9 — add-rando-confirmation-icons).
#
# When `Rando_DispatchVanillaGrant` returns `kRandoLttpSkip` for a direct-
# grant item (HalfMagic / QuarterMagic / TriforcePiece / prize bits /
# dungeon-item bits), the call site invokes `Rando_ShowDirectGrantConfirmation(item_id)`.
# The implementation looks up `kDirectGrantIcons[item_id]` (codegen'd to
# `src/rando/direct_grant_icons.h`) and, when `tile != 0`, spawns an
# `kAncillaType_RandoIconReceipt` ancilla that draws the icon above Link.
# When `tile == 0` (entry missing or unverified), the helper falls back
# to audio + HUD only (Phase A behavior preserved).
#
# Item-id catalog (the items that reach the helper today):
#   ITEM_HalfMagic (41), ITEM_QuarterMagic (42) — magic_upgrade_direct_grant
#   ITEM_TriforcePiece (52) — direct counter bump
#   ITEM_Prize_GreenPendant..BluePendant (111..113) — prize_item_direct_grant
#   ITEM_Prize_Crystal1..7 (114..120) — prize_item_direct_grant
#   ITEM_BigKey_*  (66..76)  — dungeon_item_direct_grant (11 dungeons; no HCE+HCT)
#   ITEM_Map_HyruleCastleEscape (124) + ITEM_Map_* (77..87) — dungeon_item_direct_grant
#   ITEM_Compass_* (88..98) — dungeon_item_direct_grant
#
# SmallKey items (53..65) do NOT currently reach the helper. Per
# rando.c:223-225 the dispatcher falls back to the current-dungeon vanilla
# path for SmallKey; per-dungeon-counter SmallKey direct-grant is §6.2
# Phase B work. When that lands, add SmallKey_* entries here.
#
# TILE ADDRESS DISCIPLINE (per Phase B Slice 9 §1.3):
# `tile` SHALL be a verified offset into the bundled graphics blob. Tile
# discovery is **draw-test verified**: run the binary, force the grant,
# observe the on-screen icon matches the intended item. Don't trust a
# single grep — the same icon may be referenced from multiple draw paths
# and only one is the right tile for an 8×16 ancilla.
#
# Schema:
#   icons:
#     <ItemName>:
#       tile:    <0..0xffff>   # 16-bit tile address into graphics blob.
#                              # 0 = unverified; helper falls back to audio-only.
#       palette: <0..0x7>      # CGRAM palette index (0..7 for OBJ palettes).
#       notes:   "<provenance>"# Where the tile was discovered (HUD code,
#                              # inventory drawing, etc.) — informs future debug.
#
# All entries below are STUBS with tile=0 (audio-only fallback). Each entry
# carries a `notes:` line with the suggested provenance path for draw-test
# verification. Fill in `tile:` + `palette:` after running the game and
# confirming the icon visually matches the intended item.

icons:
  # ---------------------------------------------------------------------------
  # Magic upgrades (HUD: magic-meter / decanter region)
  # ---------------------------------------------------------------------------
  HalfMagic:
    tile: 0
    palette: 0
    notes: "magic decanter HUD tile — see hud.c HUD redraw for the magic-meter area"
  QuarterMagic:
    tile: 0
    palette: 0
    notes: "quarter magic decanter HUD tile — same HUD region as HalfMagic"

  # ---------------------------------------------------------------------------
