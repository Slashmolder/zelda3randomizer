  # --- ALTTPR / Retro direct-grant items with no vanilla LttP receive bundle ---
  #     These had no LttP code, so on the field (add-rando-field-item-sprites)
  #     they fell back to the vanilla sprite and at grant they were audio-only.
  #       GenericKey (Retro shared key) -> small-key bundle (gfx 0x0f).
  #       Rupoor -> custom art (add-rando-field-item-custom-art): the vanilla
  #         rupee tile re-coloured by ALTTPR's off_black palette
  #         (kRandoCustomGfx_Rupoor; matches z3r itemdatatables.asm $59 —
  #         bundle $24 + PalettesCustom_off_black). Previously the plain
  #         green-rupee bundle, which read as a normal green rupee.
  GenericKey: { gfx: 0x0f, big: 0, oam_flags: 0x34, notes: "small-key bundle (lttp 0x24); Retro shared key" }
  Rupoor:     { gfx: 0x83, big: 0, oam_flags: 0x36, notes: "kRandoCustomGfx_Rupoor: vanilla rupee tile (bundle 0x24) + off_black palette via SP3" }

  # TrapDamage / TrapFreeze intentionally do not have fixed entries here.
  # Runtime dispatch handles the trap effect and skips Link_ReceiveItem; their
  # field/direct-grant icons are selected by rando.c from the full drawable
  # good-item decoy pool so traps do not all masquerade as one item.
