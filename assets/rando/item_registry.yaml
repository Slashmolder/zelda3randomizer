  # ===========================================================================
  # Phase B Slice 3a (#52) — 7 new IDs supporting Retro shop dispatch
  #
  # Resolved per `openspec/changes/add-rando-retro-world-state/design.md` §4
  # Risk 3 (2026-05-27). Each entry below has a distinct ROM byte from its
  # bottled / pool sibling; matches ALTTPR's `app/Item.php` byte assignments
  # exactly for cross-tool diff-ability.
  #
  # Aliased ALTTPR items (not new IDs — code-side comments at dispatch sites):
  #   ShopArrow   → ITEM_Arrow1        (ALTTPR `ItemAlias('ShopArrow', 'Arrow')`)
  #   ShopKey     → ITEM_GenericKey    (ALTTPR `ItemAlias('ShopKey', 'KeyGK')`)
  #   BlueShield  → ITEM_FighterShield (same ROM byte 0x04)
  #   RedShield   → ITEM_RedShield     (already in registry at id 10)
  # ===========================================================================
  - id: 125
    name: GenericKey
    category: shop_consumable
    dispatch: vanilla:0xAF
    notes: |
      Retro-mode inter-dungeon-transferable small key. ROM byte 0xAF.
      ALTTPR upstream: `Item\Key('KeyGK', [0xAF])` at `app/Item.php:253`;
      ALTTPR also exposes the alias `ShopKey → KeyGK` at
      `app/Item.php:270`. Phase B Slice 3a — only valid when
      `settings.world_state == Retro AND rom.genericKeys == true`
      (which Retro pins on per `app/World/Retro.php:18-23`).

  - id: 126
    name: BluePotion
    category: shop_consumable
    dispatch: vanilla:0x30
    notes: |
      Unbottled blue potion served by shops in Retro mode. ROM byte 0x30.
      Distinct from `BottleWithBluePotion` (ROM 0x2D, registry id varies)
      — the shop variant restores MP/HP on purchase rather than placing
      the bottled form into Link's inventory.
      ALTTPR upstream: `Item\BottleContents('BluePotion', [0x30])` at
      `app/Item.php:141`.

  - id: 127
    name: RedPotion
    category: shop_consumable
    dispatch: vanilla:0x2E
    notes: |
      Unbottled red potion served by shops in Retro mode. ROM byte 0x2E.
      Distinct from `BottleWithRedPotion` — see BluePotion notes for the
      bottled-vs-content distinction.
      ALTTPR upstream: `Item\BottleContents('RedPotion', [0x2E])` at
      `app/Item.php:139`.

  - id: 128
    name: BeeContents
    category: shop_consumable
    dispatch: vanilla:0x0E
    notes: |
      Unbottled bee served by the Dark World Forest Shop in Retro mode.
      ROM byte 0x0E. Distinct from `BottleWithBee` (ROM 0x3C, registry
      id 47) — same animal, different inventory slot semantics.
      ALTTPR upstream: `Item\BottleContents('Bee', [0x0E])` at
      `app/Item.php:107`.

