# LightWorld/NorthEast.yaml — Inverted LightWorld North East (Phase B Slice 2)
#
# Mechanically translated from `../alttp_vt_randomizer/app/Region/Inverted/LightWorld/NorthEast.php`
# (MIT, verified per CLAUDE.md claim-grounding discipline).
#
# Translation discipline:
#   - Every predicate cites the PHP file:line range it came from.
#   - PHP `PegasusBoots` → registry-canonical `Boots`.
#   - PHP `Powder` → `MagicPowder`.
#   - PHP `canBunnyRevive`/`canOWYBA`/`canSuperBunny`/`canBootsClip`/
#     `canOneFrameClipOW`/`canWaterWalk`/`canFakeFlipper`/`canSuperSpeed`/
#     `canDungeonRevive` are Phase B trick/glitch axes — DROPPED.
#   - PHP `region.cantTakeDamage`/`region.requireBetterBow`/
#     `region.requireBetterSword` are Phase B region-config axes — branches
#     gated on them DROP (treated as default false → guard collapses).
#   - PHP `mode.weapons == 'swordless'` branch DROPPED.
#   - PHP `goal` checks are Phase B goal-axis dependent — kept as
#     OP_GOAL_REQUIRES_DUNGEON / OP_GOAL_EQ for the Ganon prize gate.
#
# Inverted regional context:
#   - In Inverted, "Ganon" is fought in LightWorld_NorthEast (php:19, 21-22).
#     The fight slot lives at location id 212 with region=DarkWorld_NorthEast
#     per location_registry.yaml — the cross-world re-locate is owned by the
#     DarkWorld translator agent. DROPPED here.
#   - `Sahasrahla` (php:65-67): in Inverted-Open, the green pendant grants
#     are the same predicate as Standard; PHP body is `PendantOfCourage`.
#     Per our convention this maps to OP_HAS_PRIZE(Prize_GreenPendant).
#
# DROPPED locations:
#   - "Ganon" (php:19, 21-22, 144-206) — location_registry.yaml id 212
#     assigns it to DarkWorld_NorthEast. Owned by DarkWorld agent.
#   - Waterfall Bottle / Pyramid Bottle fountains: not in this PHP file's
#     overrides; inherited from Fountains.php (not in scope).
#
# Status: translated 2026-05-27. Awaiting review + codegen integration.

format_version: 1

regions:
  - id: LightWorld_NorthEast
    name: "Light World - North East (Inverted)"
    source: "app/Region/Inverted/LightWorld/NorthEast.php:13-232"

edges:
  # `can_enter` (php:208-228) in Inverted is the LIGHT-WORLD entry — Link
  # arrives from DarkWorld. Surviving Phase A disjuncts (after dropping
  # glitch/canOWYBA branches):
  #   1. DefeatAgahnim (post-Agahnim, mirror works from castle tower)
  #   2. MoonPearl AND ((Hammer AND canLiftRocks) OR canLiftDarkRocks)
  #      — the pyramid-to-mirror return path
  #   3. canFly AND canLiftDarkRocks
  #      — flute return with titan's mitt to clear the heavy rock
  #   4. West Death Mountain reachable AND (MoonPearl OR MagicMirror)
  #      AND canSuperSpeed/canBootsClip — DROPPED (Phase B glitches)
  # The DM-bottle/OWYBA disjunct (php:217-220) drops.
  - from: DarkWorld_NorthEast
    to: LightWorld_NorthEast
    predicate: "HAS_ITEM(DefeatAgahnim) OR (HAS_ITEM(MoonPearl) AND ((HAS_ITEM(Hammer) AND CanLiftRocks()) OR CanLiftDarkRocks())) OR (CanFly(world) AND CanLiftDarkRocks())"
    source: "app/Region/Inverted/LightWorld/NorthEast.php:208-228"

locations:
  # `Sahasrahla's Hut - Left` (php:32-41): MoonPearl AND canBombThings.
  # The superbunny+Boots+(MagicMirror|!cantTakeDamage) alt drops.
  - id: "Sahasrahla's Hut - Left"
    region: LightWorld_NorthEast
    can_reach: "HAS_ITEM(MoonPearl) AND CanBombThings()"
    source: "app/Region/Inverted/LightWorld/NorthEast.php:32-41"

  # `Sahasrahla's Hut - Middle` (php:43-52): same.
  - id: "Sahasrahla's Hut - Middle"
    region: LightWorld_NorthEast
    can_reach: "HAS_ITEM(MoonPearl) AND CanBombThings()"
    source: "app/Region/Inverted/LightWorld/NorthEast.php:43-52"

  # `Sahasrahla's Hut - Right` (php:54-63): same.
  - id: "Sahasrahla's Hut - Right"
    region: LightWorld_NorthEast
    can_reach: "HAS_ITEM(MoonPearl) AND CanBombThings()"
    source: "app/Region/Inverted/LightWorld/NorthEast.php:54-63"

  # `Sahasrahla` (php:65-67): PendantOfCourage → OP_HAS_PRIZE(Prize_GreenPendant).
  - id: "Sahasrahla"
    region: LightWorld_NorthEast
    can_reach: "OP_HAS_PRIZE(Prize_GreenPendant)"
    source: "app/Region/Inverted/LightWorld/NorthEast.php:65-67"

  # `King Zora` (php:69-81): (MoonPearl OR (canOWYBA AND bottle)) AND
  #   (canLiftRocks OR (canFakeFlipper OR Flippers) OR
  #    ((canBootsClip OR canWaterWalk) AND PegasusBoots) OR
  #    (canSuperSpeed AND spin AND EastDM)) OR canOneFrameClipOW
  # Phase A retained `MoonPearl AND (canLiftRocks OR Flippers)`.
  # Phase B Slice 4 §7 surfaces: pearl-bypass, fake-flippers,
  # boots-clip, and the OWG top-level bypass. canSuperSpeed +
  # canWaterWalk lack macros (Phase B reservation).
  - id: "King Zora"
    region: LightWorld_NorthEast
    can_reach: "OP_GLITCH_LEVEL_AT_LEAST(major_glitches) OR ((HAS_ITEM(MoonPearl) OR CanPearlBypass()) AND (CanLiftRocks() OR HAS_ITEM(Flippers) OR CanFakeFlippers() OR CanBootsClip()))"
    source: "app/Region/Inverted/LightWorld/NorthEast.php:69-81"

  # `Potion Shop` (php:83-91): MoonPearl AND Mushroom. The canBunnyRevive
  # and canOneFrameClipOW branches drop.
  - id: "Potion Shop"
    region: LightWorld_NorthEast
    can_reach: "HAS_ITEM(MoonPearl) AND HAS_ITEM(Mushroom)"
    source: "app/Region/Inverted/LightWorld/NorthEast.php:83-91"

  # `Zora's Ledge` (php:93-108): MoonPearl AND Flippers. All canWaterWalk/
  # canFakeFlipper/canBootsClip/canOneFrameClipOW/canSuperSpeed branches
  # drop.
  - id: "Zora's Ledge"
    region: LightWorld_NorthEast
    can_reach: "HAS_ITEM(MoonPearl) AND HAS_ITEM(Flippers)"
    source: "app/Region/Inverted/LightWorld/NorthEast.php:93-108"

  # `Waterfall Fairy - Left` (php:110-125): MoonPearl AND Flippers. All
  # glitch branches (canWaterWalk, canFakeFlipper, canBootsClip+Boots,
  # canSuperSpeed+canSpinSpeed from EastDM, canOneFrameClipOW) drop.
  - id: "Waterfall Fairy - Left"
    region: LightWorld_NorthEast
    can_reach: "HAS_ITEM(MoonPearl) AND HAS_ITEM(Flippers)"
    source: "app/Region/Inverted/LightWorld/NorthEast.php:110-125"

  # `Waterfall Fairy - Right` (php:127-142): same as Left.
  - id: "Waterfall Fairy - Right"
    region: LightWorld_NorthEast
    can_reach: "HAS_ITEM(MoonPearl) AND HAS_ITEM(Flippers)"
    source: "app/Region/Inverted/LightWorld/NorthEast.php:127-142"

