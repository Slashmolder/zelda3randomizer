# DarkWorld/South.yaml — Inverted DarkWorld South (Phase B Slice 2)
#
# Mechanically translated from `../alttp_vt_randomizer/app/Region/Inverted/DarkWorld/South.php`
# (MIT, verified per CLAUDE.md claim-grounding discipline).
#
# *** THIS YAML DECLARES `DarkWorld_South`, THE INVERTED START REGION. ***
# Per `assets/rando_logic_gen.py:1389`,
#   kRandoStartRegionByWorldState[Inverted] = DarkWorld_South
# without this declaration, the Inverted graph is unreachable.
#
# Translation discipline:
#   - Every predicate cites the PHP file:line range it came from.
#   - PHP `PegasusBoots` → registry-canonical `Boots`.
#   - PHP `Bottle` → `HasABottle()` (via macros.yaml).
#   - The Inverted/South.php class extends Standard/South.php.
#     PHP's `initialize()` does NOT call `parent::initialize()`, so only the
#     predicates declared in Inverted/South.php are active. Locations the
#     parent set up (Stumpy, Digging Game, Hype Cave - NPC variants beyond
#     what Inverted explicitly sets, etc.) inherit the framework default
#     (TRUE) when not re-set. We list only the locations the Inverted
#     class touches (the Hype Cave family at php:108-126); Stumpy and
#     Digging Game default to TRUE() with citations to Standard/South.php
#     for provenance.
#   - The Inverted constructor (php:31) adds "Link's House" to this region;
#     it has no setRequirements so its can_reach defaults to TRUE().
#   - Dropped branches: canBootsClip, canFly+OWYBA+bottle (canOWYBA),
#     canOneFrameClipOW, canSuperSpeed, canFakeFlipper, canBunnyRevive,
#     canWaterWalk, region.cantTakeDamage — Phase B logic axes; Phase A
#     pins logic=NoGlitches, tricks=none.
#   - The Inverted/South.php class does NOT set `$this->can_enter`, so the
#     start-region has no entry condition (this is the entry point for
#     Inverted mode — Link starts here per ALTTPR's Inverted layout).
#
# Status: translated 2026-05-27. Awaiting review + codegen subdir-scan
# integration (see ../README.md — codegen currently flat-scans logic_parts/).

format_version: 1

