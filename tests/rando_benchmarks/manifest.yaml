    statistic: max
    budget_ms: 5000
    # Gating after 2026-07-19 target-local calibration: 477/496/630 ms.
    gating: true
    samples:
      - corpus_label: terrain-dungeon-entrance-composes
        expected_digest: 1b453144c3bf6c99b5b7e47f7826de9e87aabe2e170eddabe454f444543e9b61

  - name: chains-pots-souls
