# Versioned generation-performance scenarios. Settings and seeds stay owned by
# tests/rando_corpus/manifest.yaml; each reference pins the placement digest so
# a renamed, duplicated, or rebaselined corpus row cannot silently change what
# this suite measures.
format_version: 1
generator_version: 160
corpus_manifest: tests/rando_corpus/manifest.yaml

scenarios:
  - name: default-generation
    suite: public
    statistic: median
    budget_ms: 2000
    gating: true  # Existing cross-platform catastrophic budget.
    samples:
      - corpus_label: a1-open-fast-ganon-default
        expected_digest: f2886e4576f7e048eaf4389f508d3f7da7e9dbdd387cbd9f2902b8756314f88b
      - corpus_label: a1-seed-0xCAFE
        expected_digest: d675da43aa5e088e193f222cafedf1f4bfc2a7767bbc31da69f0a7efd786ac77
      - corpus_label: a1-seed-0x100
        expected_digest: 11140d0dc3ad7d1d6dabb3c3d0f3a6cbe5cd593ecca5d769487bb813e877cbdb
      - corpus_label: a1-seed-large
        expected_digest: c983d2caabb83e788c930269d4ca1a2890d196322f9b1881faa870daca7d4a4e
      - corpus_label: a1-seed-multibyte
        expected_digest: 0755373bcba3bc6fd6912d200f138643631ba360cb65239bd34fd5921d9fc4c0
      - corpus_label: a1-seed-prime
        expected_digest: 354de7a03aac5dafb85bc5d557afaaf69a719860005539b9dc598fa2ead173f7
      - corpus_label: a1-seed-zero
        expected_digest: 2b0aac336a28444067abe2f5649f54e75ee11412918b292e02f06f0587ee1c14

  - name: chains-hunt
    suite: public
    statistic: max
    budget_ms: 10000
    gating: false  # Telemetry until three clean hosted-Linux runs are recorded.
    samples:
      - corpus_label: chains-hunt-none
        expected_digest: 0993696a4eb0fd32ae6f4471690a5be017b5ab5313e8e2e8a0e467b312a9459a

  - name: door-shuffle
